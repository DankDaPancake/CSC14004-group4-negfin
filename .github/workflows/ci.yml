name: Julia CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.julia }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Julia 1.9's libopenlibm requires an executable stack, rejected by
          # the newer glibc on the ubuntu-latest (26.04) runner.
          - os: ubuntu-24.04
            julia: '1.9'
          - os: ubuntu-latest
            julia: '1.12.0'
          - os: windows-latest
            julia: '1.12.0'
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - name: Run local test suite
        run: julia --startup-file=no --project=. test/runtests.jl
